name: Kernel Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [iote_stm32l4, iote_m367, iote_rza2m]

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install kconfiglib
        run: pip install kconfiglib

      - name: Build ${{ matrix.board }}
        run: make BOARD=${{ matrix.board }}
